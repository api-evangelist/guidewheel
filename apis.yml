aid: guidewheel
name: Guidewheel
description: 'Guidewheel is a FactoryOps platform for manufacturing. Non-invasive,
  clip-on current sensors attach to any machine''s power leads — regardless of age,
  make or model — and stream a real-time heartbeat of machine state (running, idle,
  down) over cellular, with no PLC, SCADA or plant Wi-Fi access required. The platform
  turns that signal into real-time OEE, downtime categorization and reasoning, Pareto
  analysis, cycle-time tracking, scrap tracking, shift and plant reporting, and alerting.
  Guidewheel exposes a REST/JSON API under /api/v1 for CMMS and ERP integration —
  devices, telemetry, uptime and load states, energy, issues, production entries, SKUs,
  tags, device lists, plants, shifts and scrap — authenticated with a company-scoped
  API key in the x-api-key header. It also ships native SAP integration plus Oracle,
  Epicor, Microsoft Dynamics, Power BI and MaintainX connections via Workato.'
