idempotency:
  supported: false
  documented: false
  note: >-
    Guidewheel publishes no idempotency key, no idempotency header, and no retry-safety
    contract for its write endpoints (POST/PATCH/PUT on issues, production entries,
    SKUs, tags, scraps). Bulk production-entry upload has a separate upload-status
    check, which is a job-status pattern rather than idempotency. Recorded as absent —
    no Idempotency pointer is emitted for this provider.
pagination:
  documented: false
  note: >-
    No pagination style, parameters, or response envelope fields are documented in the
    public integration guide. The guide states that exact path and query parameters are
    available only via the technical guide provided on request.
time_parameters:
  from_ts:
    description: Start of the requested window.
    formats:
    - unix milliseconds (most endpoints)
    - ISO 8601 string (some endpoints), e.g. '2026-06-01T00:00:00.000Z'
  to_ts:
    description: End of the requested window.
    formats:
    - unix milliseconds (most endpoints)
    - ISO 8601 string (some endpoints)
  note: >-
    Timestamp format is not uniform across endpoints — most use unix ms, some use ISO
    8601. This is an explicit inconsistency the provider documents.
grouping:
  parameter: group_by
  values:
  - day
  availability: select endpoints only (uptime; energy consumption is day-only)
resource_identity:
  path_parameter: id
  note: Most resources accept an id path parameter to address a single object (e.g.
    device id, issue id, device list id, scrap id).
granularity:
  telemetry: per-minute device-level data for any measured metric; per-second for active
    power data.
