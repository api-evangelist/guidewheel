    - Microsoft Entra ID / Azure AD
    - Google
    - OneLogin
    - any IdP supporting SAML or OIDC
    saml_requirements:
      provided_by_workos:
      - ACS URL (Assertion Consumer Service URL)
      - SP Entity ID
